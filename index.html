<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA & Mobile Meta -->
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">

  <title>EduHub Brasil – Sua Jornada Elite</title>
  <meta name="description"
    content="Aplicativo completo de estudos para ENEM, concursos e vestibulares. Simulados, vídeos, Pomodoro e muito mais." />

  <!-- Preconnect to font servers -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload Critical Assets -->
  <link rel="preload" href="css/tailwind.css" as="style" />
  <link rel="preload" href="css/app.css" as="style" />

  <!-- Critical CSS (render-blocking, kept minimal) -->
  <link rel="stylesheet" href="css/tailwind.css" />
  <link rel="stylesheet" href="css/app.css?v=54" />

  <!-- Fonts -->
  <link rel="stylesheet" href="css/lexend.css" />
  <link rel="stylesheet" href="css/material-symbols.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet">
  </noscript>

  <!-- PDF/Mammoth libraries loaded on-demand via JS (not here) -->
  <style>
    /* CSS Variables for theme-aware colors */
    :root {
      /* ── STITCH DESIGN TOKENS ── */
      --primary: #009688;
      /* Teal Primary */
      --secondary: #712ae2;
      /* Deep Purple Secondary */
      --on-surface: #191c1e;
      --on-surface-variant: #3d4a51;

      --color-primary: var(--primary);
      --color-secondary: var(--secondary);
      --color-bg-light: #ffffff;
      /* Pure White for Maximum Brilliance */
      --color-surface: #ffffff;
      --color-text-primary: #0f172a;
      --color-text-secondary: #475569;

      --ambient-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --premium-shadow: 0 12px 40px rgba(0, 150, 136, 0.08);

      --font-headline: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Manrope', sans-serif;
    }

    .dark {
      --color-primary: #10b981;
      /* Emerald for dark mode */
      --color-bg-dark: #15191d;
      --color-surface: #1e293b;
      --color-surface-alt: #0f172a;
      --color-text-primary: #f1f5f9;
      --color-text-secondary: #cbd5e1;
      --color-text-muted: #94a3b8;
      --color-border: rgba(255, 255, 255, 0.1);
      --ambient-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4,
    .font-headline {
      font-family: var(--font-headline);
    }

    mjx-container svg {
      display: inline !important;
    }

    /* ── THEME TRANSITION OVERRIDE ── */
    /* Applies smooth transition when toggling .dark class */
    body,
    #app-pages,
    .page,
    .glass-card,
    header,
    #bottom-nav,
    button,
    .pomo-capsule,
    div[id^="page-"],
    main,
    section,
    nav {
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        border-color 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        color 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>

  <!-- POST-TAILWIND: Light Mode overrides for Tailwind JIT arbitrary values -->
  <!-- Must be AFTER Tailwind CDN and app.css to override generated classes -->
  <style id="light-mode-overrides">
    /* ── STITCH DESIGN SYSTEM: LIGHT MODE ── */

    /* 1. Global Reset & Performance Fixes */
    html:not(.dark) body {
      background-color: var(--color-bg-light) !important;
      color: var(--color-text-primary) !important;
    }

    /* 2. Page & Layout Containers */
    html:not(.dark) .page,
    html:not(.dark) #app-pages,
    html:not(.dark) [id^="page-"]>div,
    html:not(.dark) main {
      background-color: var(--color-bg-light) !important;
    }

    /* 3. Cards & Surfaces (Grounded Academic Style) */
    html:not(.dark) .glass-card,
    html:not(.dark) [class*="bg-[#0f172a]"],
    html:not(.dark) [class*="bg-[#020617]"],
    html:not(.dark) [class*="bg-slate-9"],
    html:not(.dark) [class*="bg-slate-8"],
    html:not(.dark) [class*="bg-white/"],
    html:not(.dark) [class*="bg-teal-"],
    html:not(.dark) [class*="bg-emerald-"],
    html:not(.dark) [class*="bg-indigo-"],
    html:not(.dark) [class*="bg-violet-"],
    html:not(.dark) [class*="bg-orange-"],
    html:not(.dark) [class*="bg-cyan-"],
    html:not(.dark) [class*="bg-"][class*="/"] {
      background-color: #ffffff !important;
      background-image: none !important;
      opacity: 1 !important;
      border: 1px solid #e2e8f0 !important;
      /* Solid Slate-200 */
      box-shadow: var(--ambient-shadow) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      color: #0f172a !important;
      /* Slate-900 */
    }

    /* 3.1 Modal Overlays (Only visible when active to prevent dimming) */
    html:not(.dark) .modal-overlay,
    html:not(.dark) .bottom-sheet-overlay {
      display: none !important;
      background-color: rgba(30, 41, 59, 0.4) !important;
      /* Semi-transparent Slate-800 */
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      z-index: 100 !important;
    }

    html:not(.dark) .modal-overlay.active,
    html:not(.dark) .bottom-sheet-overlay.active {
      display: flex !important;
    }

    /* 3.2 Kill decorative blurry blobs in Light Mode */
    html:not(.dark) [class*="blur-3xl"] {
      display: none !important;
    }

    html:not(.dark) [class*="border-white/"] {
      border-color: #e2e8f0 !important;
    }

    /* 4. Typography & Icons (High Contrast) */
    html:not(.dark) h1,
    html:not(.dark) h2,
    html:not(.dark) h3,
    html:not(.dark) .text-white,
    html:not(.dark) .text-slate-100,
    html:not(.dark) .text-slate-200,
    html:not(.dark) .text-slate-300 {
      color: #0f172a !important;
      /* Force visibility for ghost text */
      opacity: 1 !important;
    }

    html:not(.dark) p,
    html:not(.dark) span,
    html:not(.dark) div:not([class*="bg-"]),
    html:not(.dark) .text-slate-400,
    html:not(.dark) .text-slate-500,
    html:not(.dark) .text-slate-600 {
      color: #334155 !important;
      opacity: 1 !important;
    }

    /* 5. Navigation & Headers */
    html:not(.dark) header,
    html:not(.dark) .glass-header {
      background: #ffffff !important;
      border-bottom: 1px solid #e2e8f0 !important;
      backdrop-filter: none !important;
    }

    html:not(.dark) #bottom-nav {
      background: #ffffff !important;
      border-top: 1px solid #e2e8f0 !important;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.05) !important;
    }

    /* 6. Dynamic Stats Card (Specific Dashboard Logic) */
    html:not(.dark) .stats-dashboard {
      background: linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%) !important;
      border: 1px solid rgba(0, 150, 136, 0.15) !important;
      box-shadow: var(--premium-shadow) !important;
    }

    html:not(.dark) .stats-dashboard h2,
    html:not(.dark) .stats-dashboard .text-white {
      color: var(--color-primary) !important;
    }

    html:not(.dark) .stats-dashboard .text-slate-400 {
      color: #0d9488 !important;
      opacity: 1 !important;
    }

    html:not(.dark) .quest-card.completed .text-slate-400 {
      color: #16a34a !important;
    }

    html:not(.dark) .subj-opt {
      background-color: #f8fafc !important;
      border: 1px solid #e2e8f0 !important;
      color: #475569 !important;
    }

    /* 10. Pomodoro Page - High Contrast & Layout Fixes */
    html:not(.dark) #page-pomodoro {
      background-color: #ffffff !important;
    }

    html:not(.dark) #page-pomodoro main {
      margin-top: 0 !important;
      padding-top: 20px !important;
    }

    html:not(.dark) #page-pomodoro .pomo-tab {
      color: #64748b !important;
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      overflow: visible !important;
    }

    html:not(.dark) #page-pomodoro .pomo-tab.bg-indigo-500\/10 {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
      border: 1px solid #e2e8f0 !important;
      font-weight: 800 !important;
    }

    html:not(.dark) #page-pomodoro .bg-\[#0f172a\]\/20 {
      background-color: #f8fafc !important;
      border: 1px solid #e2e8f0 !important;
    }

    html:not(.dark) #pomo-time {
      color: #0f172a !important;
    }

    html:not(.dark) .subj-opt:hover {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }

    /* 11. Profile, Progress & Simulados - High Contrast Overrides */
    html:not(.dark) #page-perfil .text-white,
    html:not(.dark) #page-progresso .text-white,
    html:not(.dark) #page-simulados .text-white,
    html:not(.dark) #page-premium .text-white,
    html:not(.dark) #page-perfil .glass-card .text-slate-300,
    html:not(.dark) #page-progresso .glass-card .text-slate-300,
    html:not(.dark) #page-simulados .glass-card .text-slate-300 {
      color: #0f172a !important;
    }

    html:not(.dark) #page-perfil .glass-card,
    html:not(.dark) #page-progresso .glass-card,
    html:not(.dark) #page-simulados .glass-card {
      background-color: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      box-shadow: var(--ambient-shadow) !important;
    }

    html:not(.dark) #page-perfil .bg-white\/5,
    html:not(.dark) #page-progresso .bg-white\/5,
    html:not(.dark) #page-simulados .bg-white\/5 {
      background-color: #f1f5f9 !important;
    }

    html:not(.dark) #page-perfil .text-slate-500,
    html:not(.dark) #page-progresso .text-slate-500,
    html:not(.dark) #page-simulados .text-slate-500 {
      color: #64748b !important;
    }

    /* Radar Chart Overrides */
    html:not(.dark) #page-progresso svg text {
      fill: #475569 !important;
      font-weight: 900 !important;
    }

    html:not(.dark) #page-progresso svg polygon[stroke^="rgba(255,255,255"] {
      stroke: rgba(15, 23, 42, 0.1) !important;
    }

    /* 7. Questions & Alternatives */
    html:not(.dark) [id^="question-card"],
    html:not(.dark) .question-card,
    html:not(.dark) .alternative-card {
      background: #ffffff !important;
      border: 2px solid #e2e8f0 !important;
      color: #0f172a !important;
    }

    html:not(.dark) .alternative-card:hover {
      background: #f8fafc !important;
      border-color: var(--color-primary) !important;
    }

    html:not(.dark) .alternative-card.selected {
      background: #f0fdfa !important;
      border-color: var(--color-primary) !important;
    }

    /* 7. Buttons & Interactive */
    html:not(.dark) .bg-emerald-500,
    html:not(.dark) .bg-primary {
      background-color: var(--color-primary) !important;
      color: white !important;
    }

    html:not(.dark) .text-emerald-400,
    html:not(.dark) .text-cyan-400,
    html:not(.dark) .text-emerald-500 {
      color: var(--color-primary) !important;
    }

    /* 8. Forms & Inputs */
    html:not(.dark) input,
    html:not(.dark) textarea {
      background-color: white !important;
      border: 1px solid rgba(0, 150, 136, 0.1) !important;
      color: var(--color-text-primary) !important;
    }

    html:not(.dark) input:focus {
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 3px rgba(0, 150, 136, 0.1) !important;
    }

    /* 9. Specialized UI Blocks */
    html:not(.dark) .quest-card {
      background-color: white !important;
      border: 1px solid rgba(0, 150, 136, 0.1) !important;
    }

    html:not(.dark) .quest-card.completed {
      background-color: #f0fdf4 !important;
      border-color: #4ade80 !important;
    }

    /* Filter Buttons Fix */
    html:not(.dark) #simulado-category-filters button:not(.active-category-filter) {
      background-color: #f1f5f9 !important;
      color: #64748b !important;
      border: 1px solid rgba(0, 0, 0, 0.05) !important;
    }

    /* 10. Scrollbar Refinement */
    html:not(.dark) ::-webkit-scrollbar-thumb {
      background: rgba(0, 150, 136, 0.15) !important;
    }

    /* Upgrade Button Correction */
    html:not(.dark) .bg-emerald-500\/10 {
      background-color: rgba(0, 150, 136, 0.15) !important;
      border: 1px solid rgba(0, 150, 136, 0.1) !important;
      color: var(--color-primary) !important;
    }

    /* Countdown Section (Orange Urgency) */
    html:not(.dark) .bg-orange-500\/10 {
      background-color: rgba(249, 115, 22, 0.12) !important;
    }

    html:not(.dark) .text-orange-400 {
      color: #ea580c !important;
    }

    /* Rank Shields & Badges */
    html:not(.dark) .rank-shield {
      border: 1px solid rgba(0, 150, 136, 0.1) !important;
    }

    /* Stats cards icons */
    html:not(.dark) .w-14.h-14.rounded-2xl.bg-orange-50,
    html:not(.dark) [class*="bg-[#0f172a]"] .material-symbols-outlined {
      color: inherit !important;
    }

    /* 11. Specific Dashboard Labels & High-Contrast Adjustments */
    html:not(.dark) .text-indigo-300,
    html:not(.dark) .text-cyan-300,
    html:not(.dark) .text-emerald-300 {
      color: var(--color-primary) !important;
    }

    html:not(.dark) [class*="bg-indigo-500/20"],
    html:not(.dark) [class*="bg-cyan-500/20"],
    html:not(.dark) [class*="bg-emerald-500/20"] {
      background-color: #f1f5f9 !important;
      /* Grounded Slate-100 tag */
      border: 1px solid #e2e8f0 !important;
      background-image: none !important;
    }

    html:not(.dark) [class*="bg-[#0f172a]"] {
      background-color: #ffffff !important;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 h-full w-full">

  <!-- Page Container -->
  <div id="app-pages"></div>

  <!-- ═══ UNIFIED BOTTOM NAVIGATION BAR ═══ -->
  <nav id="bottom-nav"
    class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg border-t border-primary/10 dark:border-white/10 px-4 py-2 pb-[max(1.5rem,env(safe-area-inset-bottom))] z-50">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <a data-route="/home" href="#/home"
        class="flex flex-col items-center gap-0.5 text-emerald-500 transition-colors cursor-pointer">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">home</span>
        <span class="text-[10px] font-bold">Início</span>
      </a>
      <a data-route="/simulados" href="#/simulados"
        class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-primary transition-colors cursor-pointer">
        <span class="material-symbols-outlined">assignment</span>
        <span class="text-[10px] font-medium">Simulados</span>
      </a>
      <a data-route="/pomodoro" href="#/pomodoro"
        class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-primary transition-colors cursor-pointer">
        <span class="material-symbols-outlined">timer</span>
        <span class="text-[10px] font-medium">Foco</span>
      </a>
      <a data-route="/videos" href="#/videos"
        class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-primary transition-colors cursor-pointer">
        <span class="material-symbols-outlined">video_library</span>
        <span class="text-[10px] font-medium">Vídeos</span>
      </a>
      <a data-route="/progresso" href="#/progresso"
        class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-primary transition-colors cursor-pointer">
        <span class="material-symbols-outlined">trending_up</span>
        <span class="text-[10px] font-medium">Progresso</span>
      </a>
    </div>
  </nav>

  <!-- ═══ UPGRADE MODAL (Bottom Sheet) ═══ -->
  <div id="upgrade-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="flex h-6 w-full items-center justify-center">
        <div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-slate-700"></div>
      </div>
      <div class="px-6 pt-2 pb-8">
        <div class="flex justify-center mb-6">
          <div class="relative">
            <div class="h-24 w-24 bg-primary/10 rounded-full flex items-center justify-center">
              <span class="material-symbols-outlined text-5xl text-primary fill-icon">lock_open</span>
            </div>
            <div
              class="absolute -top-1 -right-1 h-8 w-8 bg-yellow-400 rounded-full flex items-center justify-center border-4 border-background-light dark:border-background-dark">
              <span class="material-symbols-outlined text-white text-sm fill-icon">grade</span>
            </div>
          </div>
        </div>
        <div class="text-center mb-8">
          <h3 class="text-2xl font-bold leading-tight mb-3">Desbloqueie mais recursos!</h3>
          <p class="text-slate-600 dark:text-slate-400 text-base leading-relaxed">Upgrade a partir do Plano Básico e
            desbloqueie o Domínio por Área, banco de questões ampliado e simulados exclusivos.</p>
        </div>
        <div class="flex flex-col gap-3 mt-2">
          <button data-upgrade-action="plans"
            class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl text-lg flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
            Ver Planos <span class="material-symbols-outlined">arrow_forward</span>
          </button>
          <button data-upgrade-action="dismiss"
            class="w-full text-slate-400 dark:text-slate-500 font-bold py-3 rounded-lg text-sm hover:text-white dark:hover:text-white transition-colors">
            Agora não, obrigado
          </button>
        </div>
      </div>
      <div class="h-6 bg-background-light dark:bg-background-dark"></div>
    </div>
  </div>

  <!-- Markdown + Math bootstrap moved to external file for CSP hardening -->
  <script defer src="js/markdown-math-bootstrap.js?v=72"></script>

  <!-- Scripts (defer preserves order but doesn't block rendering) -->
  <script defer src="js/data.js?v=71"></script>
  <script defer src="js/router.js?v=71"></script>
  <script defer src="js/pages-core.js?v=71"></script>
  <script defer src="js/pages-extra.js?v=71"></script>
  <script defer src="js/pages-more.js?v=71"></script>
  <script defer src="js/sound-manager.js?v=71"></script>
  <script defer src="js/vendor/supabase.js"></script>
  <script defer src="js/vendor/purify.min.js"></script>
  <script defer src="js/security-utils.js?v=71"></script>
  <script defer src="js/supabase.js?v=71"></script>
  <script defer src="js/ai-service.js?v=71"></script>
  <script defer src="js/billing-service.js?v=71"></script>
  <script defer src="js/app.js?v=71"></script>
</body>

</html>
